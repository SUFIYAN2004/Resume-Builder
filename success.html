<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | ResuMate</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a1b26 0%, transparent 70%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .success-card {
            background: #121212;
            padding: 50px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .check-circle {
            width: 80px; height: 80px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        .check-icon { font-size: 3rem; color: #10b981; }

        h1 { font-weight: 700; margin-bottom: 10px; }
        p { color: #a1a1aa; font-size: 1.1rem; margin-bottom: 30px; }

        .btn-home {
            background: white; color: black;
            padding: 12px 30px; border-radius: 50px; font-weight: 600;
            transition: all 0.3s; border: none; width: 100%; margin-bottom: 25px;
        }
        .btn-home:hover { background: #e5e5e5; transform: translateY(-2px); }

        .social-icons { display: flex; justify-content: center; gap: 15px; }
        .social-btn {
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: white; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); text-decoration: none; transition: 0.3s;
        }
        .social-btn:hover { background: white; color: black; transform: translateY(-3px); }
        .share-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #52525b; font-weight: 700; display: block; margin-bottom: 15px;}
    </style>
</head>
<body>

    <div class="success-card">
        <div class="check-circle"><i class="bi bi-check-lg check-icon"></i></div>
        <h1>Download Ready!</h1>
        <p>Your professional resume has been generated. Good luck!</p>
        
        <a href="index.html" class="btn btn-home"><i class="bi bi-arrow-left me-2"></i> Create Another</a>

        <span class="share-label">Share the project</span>
        <div class="social-icons">
            <a href="#" class="social-btn"><i class="bi bi-whatsapp"></i></a>
            <a href="#" class="social-btn"><i class="bi bi-linkedin"></i></a>
            <a href="#" class="social-btn"><i class="bi bi-twitter-x"></i></a>
        </div>
    </div>

    <script>
        window.onload = function() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffffff', '#10b981'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffffff', '#38bdf8'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        };
    </script>
</body>
</html>
